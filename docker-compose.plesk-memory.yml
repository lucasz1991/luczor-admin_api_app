name: luczor-memory

x-luczor-logging: &luczor-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    # Opt-in only: production hosts normally keep the already cut over
    # luczor-redis-auth container. An unqualified `docker compose up` must
    # never start a competing Redis on the same loopback port.
    profiles:
      - redis-cutover
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    entrypoint:
      - /bin/sh
      - /usr/local/bin/luczor-redis-entrypoint
    environment:
      LUCZOR_REDIS_MAXMEMORY: ${LUCZOR_REDIS_MAXMEMORY:-192mb}
    secrets:
      - redis_password
    volumes:
      - ${LUCZOR_REDIS_DATA_DIR:-/var/lib/luczor/redis}:/data
      - ./docker/redis/entrypoint.sh:/usr/local/bin/luczor-redis-entrypoint:ro
    tmpfs:
      # Mount a parent tmpfs and create the private 0700 directory below it.
      # Docker forbids chmod/chown on the root of a tmpfs mount under the
      # container's reduced capability set.
      - /tmp:size=1m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - cache
    logging: *luczor-logging
    pids_limit: 128
    mem_limit: ${LUCZOR_REDIS_MEMORY_LIMIT:-256m}
    cpus: ${LUCZOR_REDIS_CPU_LIMIT:-0.75}
    read_only: true
    stop_grace_period: 30s

  # Docker 29 does not publish a host port for a container attached only to
  # an internal network. Keep Redis isolated and expose it through the same
  # fixed-upstream, secret-free loopback pattern used for Cognee below.
  redis-loopback:
    profiles:
      - redis-cutover
    image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    user: "101:101"
    entrypoint:
      - nginx
    command:
      - -c
      - /etc/nginx/luczor-redis-loopback.conf
      - -g
      - daemon off;
    volumes:
      - ./docker/nginx/redis-loopback.conf:/etc/nginx/luczor-redis-loopback.conf:ro
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "{ printf '*1\\r\\n$$4\\r\\nPING\\r\\n'; sleep 1; } | nc -w 2 127.0.0.1 8080 | grep -q NOAUTH"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - cache
      - loopback-publish
    logging: *luczor-logging
    pids_limit: 32
    mem_limit: ${LUCZOR_REDIS_LOOPBACK_MEMORY_LIMIT:-32m}
    cpus: ${LUCZOR_REDIS_LOOPBACK_CPU_LIMIT:-0.10}
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777

  postgres:
    image: pgvector/pgvector:pg16
    entrypoint:
      - /bin/sh
      - /usr/local/bin/luczor-postgres-entrypoint
    command:
      - postgres
    environment:
      POSTGRES_DB: ${COGNEE_POSTGRES_ADMIN_DB:-luczor_cognee_admin}
      POSTGRES_USER: ${COGNEE_POSTGRES_ADMIN_USER:-luczor_cognee_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      COGNEE_POSTGRES_DB: ${COGNEE_POSTGRES_DB:-luczor_cognee}
      COGNEE_POSTGRES_USER: ${COGNEE_POSTGRES_USER:-luczor_cognee}
    secrets:
      - postgres_password
    volumes:
      - cognee_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/05-configure-cognee-hba.sh:/docker-entrypoint-initdb.d/05-configure-cognee-hba.sh:ro
      - ./docker/postgres/entrypoint.sh:/usr/local/bin/luczor-postgres-entrypoint:ro
      - ./docker/postgres/configure-cognee-hba.sh:/usr/local/bin/configure-cognee-hba:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    logging: *luczor-logging
    pids_limit: 256
    mem_limit: ${LUCZOR_COGNEE_POSTGRES_MEMORY_LIMIT:-768m}
    cpus: ${LUCZOR_COGNEE_POSTGRES_CPU_LIMIT:-1.0}

  cognee-db-init:
    image: pgvector/pgvector:pg16
    entrypoint:
      - /bin/sh
      - /usr/local/bin/ensure-cognee-db
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_ADMIN_DB: ${COGNEE_POSTGRES_ADMIN_DB:-luczor_cognee_admin}
      POSTGRES_ADMIN_USER: ${COGNEE_POSTGRES_ADMIN_USER:-luczor_cognee_admin}
      COGNEE_POSTGRES_DB: ${COGNEE_POSTGRES_DB:-luczor_cognee}
      COGNEE_POSTGRES_USER: ${COGNEE_POSTGRES_USER:-luczor_cognee}
    secrets:
      - postgres_password
      - cognee_postgres_password
    volumes:
      - ./docker/postgres/ensure-cognee-db.sh:/usr/local/bin/ensure-cognee-db:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - data
    logging: *luczor-logging
    pids_limit: 64
    mem_limit: ${LUCZOR_COGNEE_DB_INIT_MEMORY_LIMIT:-128m}
    cpus: ${LUCZOR_COGNEE_DB_INIT_CPU_LIMIT:-0.5}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

  ollama:
    image: ollama/ollama:0.33.1@sha256:075246f72d4109385b4a01c3ac8e9cbd26a0bcb21cd7aa30edbccd24e1b3180c
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: ${LUCZOR_OLLAMA_MAX_QUEUE:-32}
      OLLAMA_KEEP_ALIVE: ${LUCZOR_OLLAMA_KEEP_ALIVE:-2m}
      OLLAMA_CONTEXT_LENGTH: ${LUCZOR_OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      LUCZOR_OLLAMA_LLM_MODEL: ${COGNEE_OLLAMA_LLM_MODEL:-llama3.2:3b}
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test:
        - CMD-SHELL
        - OLLAMA_HOST=127.0.0.1:11434 ollama show "$${LUCZOR_OLLAMA_LLM_MODEL}" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - inference
    logging: *luczor-logging
    pids_limit: 512
    mem_limit: ${LUCZOR_OLLAMA_MEMORY_LIMIT:-4g}
    cpus: ${LUCZOR_OLLAMA_CPU_LIMIT:-2.0}

  # This opt-in helper is the only service in this stack with registry egress.
  # It exits immediately after filling the shared, persistent model volume.
  ollama-model-bootstrap:
    profiles:
      - model-bootstrap
    image: ollama/ollama:0.33.1@sha256:075246f72d4109385b4a01c3ac8e9cbd26a0bcb21cd7aa30edbccd24e1b3180c
    entrypoint:
      - /bin/sh
      - -ec
      - |
        ollama serve &
        server_pid=$$!
        trap 'kill "$$server_pid" 2>/dev/null || true' EXIT INT TERM
        until OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1; do sleep 1; done
        OLLAMA_HOST=127.0.0.1:11434 ollama pull "$${LUCZOR_OLLAMA_LLM_MODEL}"
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      LUCZOR_OLLAMA_LLM_MODEL: ${COGNEE_OLLAMA_LLM_MODEL:-llama3.2:3b}
    volumes:
      - ollama_models:/root/.ollama
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - model-bootstrap
    logging: *luczor-logging
    pids_limit: 512
    mem_limit: ${LUCZOR_OLLAMA_BOOTSTRAP_MEMORY_LIMIT:-4g}
    cpus: ${LUCZOR_OLLAMA_BOOTSTRAP_CPU_LIMIT:-2.0}

  cognee:
    build:
      context: ./services/cognee
      target: luczor-cognee-production
    environment:
      TELEMETRY_DISABLED: "true"
      OTEL_SDK_DISABLED: "true"
      VECTOR_DB_PROVIDER: lancedb
      GRAPH_DATABASE_PROVIDER: kuzu
      GRAPH_DATASET_DATABASE_HANDLER: kuzu
      DB_PROVIDER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${COGNEE_POSTGRES_DB:-luczor_cognee}
      DB_USERNAME: ${COGNEE_POSTGRES_USER:-luczor_cognee}
      SYSTEM_ROOT_DIRECTORY: /data/system
      DATA_ROOT_DIRECTORY: /data/data
      LLM_PROVIDER: ollama
      LLM_MODEL: ${COGNEE_OLLAMA_LLM_MODEL:-llama3.2:3b}
      LLM_ENDPOINT: http://ollama:11434/v1
      LLM_MAX_COMPLETION_TOKENS: ${COGNEE_LLM_MAX_COMPLETION_TOKENS:-4096}
      LLM_INSTRUCTOR_MODE: json_mode
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      EMBEDDING_DIMENSIONS: "384"
      EMBEDDING_BATCH_SIZE: ${COGNEE_EMBEDDING_BATCH_SIZE:-4}
      EMBEDDING_MAX_COMPLETION_TOKENS: ${COGNEE_EMBEDDING_MAX_COMPLETION_TOKENS:-512}
      FASTEMBED_CACHE_PATH: /opt/luczor-fastembed-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      REQUIRE_AUTHENTICATION: "true"
      ENABLE_BACKEND_ACCESS_CONTROL: "true"
      DEFAULT_USER_EMAIL: cognee-service@luczor.follow-flow.de
      JWT_LIFETIME_SECONDS: 3600
      CORS_ALLOWED_ORIGINS: http://127.0.0.1
      ACCEPT_LOCAL_FILE_PATH: "false"
      ALLOW_HTTP_REQUESTS: "false"
      ALLOW_CYPHER_QUERY: "false"
      HASH_API_KEY: "true"
    secrets:
      - cognee_postgres_password
      - cognee_jwt_secret
      - cognee_default_password
      - cognee_verification_secret
      - cognee_reset_secret
    volumes:
      - cognee_data:/data
    depends_on:
      cognee-db-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - data
      - inference
    logging: *luczor-logging
    pids_limit: 512
    mem_limit: ${LUCZOR_COGNEE_MEMORY_LIMIT:-4g}
    cpus: ${LUCZOR_COGNEE_CPU_LIMIT:-2.0}

  # Docker does not publish ports for containers attached exclusively to
  # internal networks. Keep Cognee itself isolated and expose it through this
  # secret-free, fixed-upstream gateway bound only to the host loopback.
  cognee-loopback:
    image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    user: "101:101"
    entrypoint:
      - nginx
    command:
      - -c
      - /etc/nginx/luczor-loopback.conf
      - -g
      - daemon off;
    volumes:
      - ./docker/nginx/cognee-loopback.conf:/etc/nginx/luczor-loopback.conf:ro
    ports:
      - "127.0.0.1:${COGNEE_HOST_PORT:-8010}:8080"
    depends_on:
      cognee:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/openapi.json
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - data
      - loopback-publish
    logging: *luczor-logging
    pids_limit: 64
    mem_limit: ${LUCZOR_COGNEE_LOOPBACK_MEMORY_LIMIT:-64m}
    cpus: ${LUCZOR_COGNEE_LOOPBACK_CPU_LIMIT:-0.25}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

secrets:
  redis_password:
    file: "${LUCZOR_DOCKER_SECRETS_DIR:-./docker/secrets}/redis_password"
  postgres_password:
    file: "${LUCZOR_DOCKER_SECRETS_DIR:-./docker/secrets}/postgres_password"
  cognee_postgres_password:
    file: "${LUCZOR_DOCKER_SECRETS_DIR:-./docker/secrets}/cognee_postgres_password"
  cognee_jwt_secret:
    file: "${LUCZOR_DOCKER_SECRETS_DIR:-./docker/secrets}/cognee_jwt_secret"
  cognee_default_password:
    file: "${LUCZOR_DOCKER_SECRETS_DIR:-./docker/secrets}/cognee_default_password"
  cognee_verification_secret:
    file: "${LUCZOR_DOCKER_SECRETS_DIR:-./docker/secrets}/cognee_verification_secret"
  cognee_reset_secret:
    file: "${LUCZOR_DOCKER_SECRETS_DIR:-./docker/secrets}/cognee_reset_secret"

volumes:
  cognee_postgres_data:
  cognee_data:
  ollama_models:

networks:
  cache:
    internal: true
  data:
    internal: true
  inference:
    internal: true
  model-bootstrap:
  # Only this secret-free gateway uses a regular bridge so Docker can publish
  # its port. Its nginx configuration can connect solely to the fixed Cognee
  # upstream; Cognee, Ollama and PostgreSQL remain on internal networks.
  loopback-publish:
