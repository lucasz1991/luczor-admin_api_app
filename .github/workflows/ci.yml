name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run security:audit

  php-quality:
    name: PHP quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_pgsql, pcntl, posix, redis
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run static analysis
        run: composer run analyse

      - name: Check formatting of changed PHP files
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z "$base" "$GITHUB_SHA" -- '*.php')
          if (( ${#files[@]} == 0 )); then
            echo "No changed PHP files."
            exit 0
          fi

          vendor/bin/pint --test "${files[@]}"

      - name: Audit Composer dependencies
        run: composer run security:audit

  python-sidecars:
    name: Python sidecar (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Graph indexer
            directory: services/graph-indexer
            requirements: services/graph-indexer/requirements.txt
          - name: MCP gateway
            directory: services/mcp-gateway
            requirements: services/mcp-gateway/requirements.txt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install sidecar and audit tooling
        run: python -m pip install --disable-pip-version-check --requirement "${{ matrix.requirements }}" pip-audit pytest

      - name: Audit Python dependencies
        run: pip-audit --requirement "${{ matrix.requirements }}"

      - name: Compile and test sidecar
        working-directory: ${{ matrix.directory }}
        run: |
          python -m compileall -q .
          python -m pytest -q test_main.py

  database-tests:
    name: Laravel tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.4
            connection: mysql
            port: 3306
            username: root
            password: root
          - name: PostgreSQL 16
            connection: pgsql
            port: 5432
            username: postgres
            password: postgres

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: luczor_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: luczor_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d luczor_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_URL: http://localhost
      CACHE_DRIVER: array
      DB_CONNECTION: ${{ matrix.connection }}
      DB_DATABASE: luczor_test
      DB_HOST: 127.0.0.1
      DB_PASSWORD: ${{ matrix.password }}
      DB_PORT: ${{ matrix.port }}
      DB_USERNAME: ${{ matrix.username }}
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_pgsql, pcntl, posix, redis
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify migrations
        run: php artisan migrate:fresh --force

      - name: Run Laravel tests
        run: php artisan test
