            - paragraph [ref=f2e111]: Der Grundentwurf spricht Deutsch, ist klar und freundlich und unterstützt Laravel, Livewire, Alpine.js, Tailwind CSS sowie lokale Diagnose. Alle Texte sind hier einsehbar und bearbeitbar. Aktive Prompt-Skills gelten für den jeweiligen Nutzer und globale Skills für alle; Workflows starten ausschließlich auf Anforderung.
