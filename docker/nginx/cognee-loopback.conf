worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Resolve through Docker DNS on every reconnect so a recreated Cognee
    # container never leaves the long-running gateway with a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 2m;

        location / {
            set $cognee_upstream http://cognee:8000;
            proxy_pass $cognee_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host cognee;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
