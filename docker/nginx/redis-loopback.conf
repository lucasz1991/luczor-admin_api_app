worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

stream {
    upstream luczor_redis {
        server redis:6379;
    }

    server {
        listen 8080;
        proxy_connect_timeout 3s;
        proxy_timeout 1h;
        proxy_pass luczor_redis;
    }
}
