worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

# Every proxied Redis client holds two nginx connections (client + upstream).
# 128 allowed only ~60 clients; with PHP-FPM, Horizon, the scheduler and Reverb
# the gateway ran out and dropped new clients right after accept, which PHP
# reports as "read error on connection". Small buffers keep ~1000 clients
# inside the container's 32 MB memory limit.
worker_rlimit_nofile 4096;

events {
    worker_connections 2048;
}

stream {
    upstream luczor_redis {
        server redis:6379;
    }

    server {
        listen 8080;
        proxy_connect_timeout 3s;
        proxy_timeout 1h;
        proxy_buffer_size 4k;
        proxy_pass luczor_redis;
    }
}
